<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--surface:#111827;--surface2:#1a2332;--border:#1e2d42;--text:#e2e8f0;--text2:#94a3b8;--accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--yellow:#eab308;--orange:#f97316;--red:#ef4444;--purple:#a855f7;--cyan:#06b6d4}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.container{max-width:1200px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:24px}
.drop-zone{border:2px dashed var(--border);border-radius:16px;padding:48px 24px;text-align:center;transition:all .3s;cursor:pointer;background:var(--surface);margin-bottom:24px}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(59,130,246,.05);box-shadow:0 0 30px rgba(59,130,246,.1)}
.drop-zone svg{width:64px;height:64px;color:var(--accent);margin-bottom:16px;opacity:.7}
.drop-zone p{color:var(--text2);font-size:.95rem}
.drop-zone .formats{color:var(--text2);font-size:.75rem;margin-top:8px;opacity:.6}
.results{display:none}
.results.show{display:block;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card-title{font-size:1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{width:20px;height:20px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.info-item{background:var(--surface2);border-radius:8px;padding:12px}
.info-item .label{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.info-item .value{font-size:1.05rem;font-weight:600}
.quality-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.quality-badge.pass{background:rgba(34,197,94,.15);color:var(--green)}
.quality-badge.hint{background:rgba(234,179,8,.15);color:var(--yellow)}
.quality-badge.warn{background:rgba(249,115,22,.15);color:var(--orange)}
.quality-badge.fail{background:rgba(239,68,68,.15);color:var(--red)}
.quality-overall{font-size:1.3rem;text-align:center;padding:16px;border-radius:12px;margin-bottom:16px}
.quality-overall.pass{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.quality-overall.hint{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.3)}
.quality-overall.warn{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3)}
.quality-overall.fail{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.rating-list{display:grid;gap:8px}
.rating-row{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--surface2);border-radius:8px}
.rating-row .name{flex:1;font-size:.85rem}
.rating-row .detail{font-size:.75rem;color:var(--text2);max-width:300px;text-align:right}
.canvas-wrap{position:relative;width:100%;margin:8px 0}
.canvas-wrap canvas{width:100%;border-radius:8px;background:#000;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.75rem;color:var(--text2)}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-item .dot{width:10px;height:10px;border-radius:50%}
.spectrogram-wrap{overflow-x:auto;overflow-y:hidden}
.spectrogram-wrap canvas{height:256px;min-width:100%}
.loading{display:none;text-align:center;padding:40px}
.loading.show{display:block}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.clipping-indicator{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle}
.clipping-indicator.ok{background:var(--green)}
.clipping-indicator.clip{background:var(--red);box-shadow:0 0 8px var(--red)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.two-col{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr 1fr}}
</style>

// ===================== UTILITIES =====================
const DB_FLOOR = -96;

function linearTodB(val) { return 20 * Math.log10(Math.max(1e-12, val)); }
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(2) + ' MB';
}
function formatDuration(s) {
  const m = Math.floor(s/60), sec = (s%60).toFixed(1);
  return `${m}:${sec.padStart(4,'0')}`;
}
function readUint32BE(buf, off) {
  return (buf[off]<<24)|(buf[off+1]<<16)|(buf[off+2]<<8)|buf[off+3];
}
function readUint24BE(buf, off) {
  return (buf[off]<<16)|(buf[off+1]<<8)|buf[off+2];
}
function readUint16BE(buf, off) {
  return (buf[off]<<8)|buf[off+1];
}
function readUint32LE(view, off) { return view.getUint32(off, true); }
function readUint16LE(view, off) { return view.getUint16(off, true); }

// ===================== FORMAT PARSERS =====================

// --- FLAC ---
function parseFlac(buffer) {
  const fb = new Uint8Array(buffer);
  if (fb[0]!==0x66||fb[1]!==0x4C||fb[2]!==0x61||fb[3]!==0x43) return null; // "fLaC"
  let offset = 4;
  for (let i = 0; i < 30; i++) {
    if (offset + 4 >= fb.length) break;
    const isLast = (fb[offset] & 0x80) !== 0;
    const blockType = fb[offset] & 0x7F;
    const blockLen = readUint24BE(fb, offset + 1);
    if (blockType === 0 && blockLen >= 34) { // STREAMINFO
      const o = offset + 4;
      // STREAMINFO structure (bytes 0-33):
      // 0-1: min block size
      // 2-3: max block size
      // 4-6: min frame size (24-bit)
      // 7-9: max frame size (24-bit)
      // 10: sample rate bits 19-12 (8 bits)
      // 11: sample rate bits 11-4 (8 bits)
      // 12 top nibble: sample rate bits 3-0 (4 bits)
      // 12 bottom 3 bits: channels-1 (3 bits)
      // 12 bit 0: bits per sample bit 4
      // 13 top nibble: bits per sample bits 3-0 (4 bits)
      // ... rest: total samples + MD5
      const sampleRate = (fb[o+10]<<12) | (fb[o+11]<<4) | ((fb[o+12]>>4) & 0x0F);
      const channels = ((fb[o+12]>>1) & 0x07) + 1;
      const bitDepth = (((fb[o+12]&0x01)<<4) | ((fb[o+13]>>4)&0x0F)) + 1;
      return { codec: 'FLAC', container: 'FLAC', isLossless: true, sampleRate, channels, bitDepth };
    }
    offset += 4 + blockLen;
    if (isLast) break;
  }
  return { codec: 'FLAC', container: 'FLAC', isLossless: true };
}

// --- WAV ---
function parseWav(buffer) {
  const view = new DataView(buffer);
  const fb = new Uint8Array(buffer);
  if (fb[0]!==0x52||fb[1]!==0x49||fb[2]!==0x46||fb[3]!==0x46) return null; // "RIFF"
  if (fb[8]!==0x57||fb[9]!==0x41||fb[10]!==0x56||fb[11]!==0x45) return null; // "WAVE"
  let offset = 12;
  while (offset + 8 < buffer.byteLength) {
    const id = readUint32BE(fb, offset);
    const size = readUint32LE(view, offset + 4);
    if (id === 0x666D7420) { // "fmt "
      const audioFormat = readUint16LE(view, offset + 8);
      const channels = readUint16LE(view, offset + 10);
      const sampleRate = readUint32LE(view, offset + 12);
      const bitsPerSample = readUint16LE(view, offset + 22);
      // WAV format codes:
      //   1     = PCM (integer, lossless)
      //   3     = IEEE 754 Float (lossless)
      //   0xFFFE = Extensible (typically PCM inside, lossless)
      //   Others = compressed (lossy) — e.g. 85=MP3, 6=ALAC, 2=ADPCM
      const losslessCodes = [1, 3, 0xFFFE];
      const isLossless = losslessCodes.includes(audioFormat);
      let codecName;
      if (audioFormat === 1) codecName = 'WAV (PCM Integer)';
      else if (audioFormat === 3) codecName = 'WAV (IEEE Float)';
      else if (audioFormat === 0xFFFE) codecName = 'WAV (Extensible PCM)';
      else codecName = 'WAV (Compressed, fmt=' + audioFormat + ')';
      return { codec: codecName, container: 'WAV/RIFF', isLossless, sampleRate, channels, bitDepth: bitsPerSample };
    }
    offset += 8 + size;
    if (offset >= buffer.byteLength) break;
  }
  return { codec: 'WAV', container: 'WAV/RIFF', isLossless: true };
}

// --- AIFF ---
function parseAiff(buffer) {
  const fb = new Uint8Array(buffer);
  const view = new DataView(buffer);
  if (fb[0]!==0x46||fb[1]!==0x4F||fb[2]!==0x52||fb[3]!==0x4D) return null; // "FORM"
  let offset = 12;
  while (offset + 8 < buffer.byteLength) {
    const id = readUint32BE(fb, offset);
    const size = view.getUint32(offset + 4);
    if (id === 0x434F4D4D) { // "COMM"
      const channels = view.getUint16(offset + 8);
      const bitsPerSample = view.getUint16(offset + 14);
      // IEEE 754 extended (80-bit) sample rate at offset+16
      const srBytes = new Uint8Array(buffer, offset + 16, 10);
      const exponent = ((srBytes[0]<<8)|srBytes[1]) - 16383;
      let mantissaHigh = 0;
      for (let i = 2; i < 6; i++) mantissaHigh = mantissaHigh * 256 + srBytes[i];
      let mantissaLow = 0;
      for (let i = 6; i < 10; i++) mantissaLow = mantissaLow * 256 + srBytes[i];
      const mantissa = mantissaHigh * Math.pow(2, 32) + mantissaLow;
      const sampleRate = Math.round(mantissa * Math.pow(2, exponent - 63));
      const isAifc = fb[8]===0x41&&fb[9]===0x49&&fb[10]===0x46&&fb[11]===0x43;
      return {
        codec: isAifc ? 'AIFC' : 'AIFF',
        container: 'AIFF',
        isLossless: !isAifc,
        sampleRate, channels, bitDepth: bitsPerSample
      };
    }
    offset += 8 + size;
    if (offset % 2 !== 0) offset++;
    if (offset >= buffer.byteLength) break;
  }
  return { codec: 'AIFF', container: 'AIFF', isLossless: true };
}

// --- MP3 ---
function parseMp3(buffer) {
  const fb = new Uint8Array(buffer);
  // Skip ID3v2 tag if present
  let offset = 0;
  if (fb[0]===0x49&&fb[1]===0x44&&fb[2]===0x33) { // "ID3"
    const size = ((fb[6]&0x7F)<<21)|((fb[7]&0x7F)<<14)|((fb[8]&0x7F)<<7)|(fb[9]&0x7F);
    offset = 10 + size;
  }
  // Find first valid MPEG frame
  const srTable = [
    [11025, 12000, 8000, 0],   // MPEG 2.5
    [0, 0, 0, 0],              // reserved
    [22050, 24000, 16000, 0],  // MPEG 2
    [44100, 48000, 32000, 0]   // MPEG 1
  ];
  const brTableV1L3 = [0,32,40,48,56,64,80,96,112,128,160,192,224,256,320,0];
  const brTableV2L3 = [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160,0];
  for (let i = offset; i < Math.min(fb.length - 4, offset + 65536); i++) {
    if (fb[i]===0xFF && (fb[i+1]&0xE0)===0xE0) {
      const verIdx = (fb[i+1]>>3)&0x03;
      const layerIdx = (fb[i+1]>>1)&0x03;
      const srIdx = (fb[i+2]>>2)&0x03;
      const brIdx = (fb[i+2]>>4)&0x0F;
      const sampleRate = srTable[verIdx][srIdx];
      const isV1 = verIdx === 3;
      const bitrate = isV1 ? brTableV1L3[brIdx] : brTableV2L3[brIdx];
      const channels = ((fb[i+3]>>6)&0x03) === 3 ? 1 : 2; // 3=mono
      if (sampleRate > 0) {
        return { codec: 'MP3', container: 'MP3', isLossless: false, sampleRate, channels, bitDepth: null, bitrate };
      }
    }
  }
  return { codec: 'MP3', container: 'MP3', isLossless: false };
}

// --- OGG / Opus ---
function parseOgg(buffer) {
  const fb = new Uint8Array(buffer);
  if (fb[0]!==0x4F||fb[1]!==0x67||fb[2]!==0x67||fb[3]!==0x53) return null; // "OggS"
  // Find first page after header and look for Opus or Vorbis
  let offset = 0;
  for (let page = 0; page < 5 && offset < fb.length - 27; page++) {
    if (fb[offset]!==0x4F||fb[offset+1]!==0x67||fb[offset+2]!==0x67||fb[offset+3]!==0x53) break;
    const numSegments = fb[offset + 26];
    let pageSize = 27 + numSegments;
    for (let s = 0; s < numSegments; s++) pageSize += fb[offset + 27 + s];
    // Check for Opus header at segment 0
    const seg0Len = fb[offset + 27];
    const payloadStart = offset + 27 + numSegments;
    if (payloadStart + seg0Len <= fb.length) {
      if (seg0Len >= 19 && fb[payloadStart]===0x4F&&fb[payloadStart+1]===0x70&&fb[payloadStart+2]===0x75&&fb[payloadStart+3]===0x73) {
        // Opus identification header
        const version = fb[payloadStart + 8];
        const channels = fb[payloadStart + 9];
        const sampleRate = readUint32LE(new DataView(buffer), payloadStart + 12);
        const bitrate = readUint32LE(new DataView(buffer), payloadStart + 20);
        return { codec: 'Opus', container: 'OGG', isLossless: false, sampleRate: sampleRate || 48000, channels, bitDepth: null, bitrate: bitrate/1000 };
      }
      if (seg0Len >= 30 && fb[payloadStart]===0x01) {
        // Vorbis identification header
        if (fb[payloadStart+1]===0x76&&fb[payloadStart+2]===0x6F&&fb[payloadStart+3]===0x72&&fb[payloadStart+4]===0x62&&fb[payloadStart+5]===0x69&&fb[payloadStart+6]===0x73) {
          const channels = fb[payloadStart + 11];
          const sampleRate = readUint32LE(new DataView(buffer), payloadStart + 12);
          const bitrateNom = readUint32LE(new DataView(buffer), payloadStart + 20);
          return { codec: 'Vorbis', container: 'OGG', isLossless: false, sampleRate, channels, bitDepth: null, bitrate: bitrateNom/1000 };
        }
      }
    }
    offset += pageSize;
  }
  return { codec: 'OGG', container: 'OGG', isLossless: false };
}

// --- MP4 / M4A / ALAC ---
function parseMp4(buffer) {
  const fb = new Uint8Array(buffer);
  const view = new DataView(buffer);
  if (fb[4]!==0x66||fb[5]!==0x74||fb[6]!==0x79||fb[7]!==0x70) return null; // "ftyp"

  let result = { codec: 'AAC', container: 'MP4/M4A', isLossless: false };
  let alacInfo = null;
  let aacSampleRate = null;
  let aacChannels = null;

  // Iterate top-level atoms
  let offset = 0;
  function parseAtom(offset, depth) {
    if (offset + 8 >= buffer.byteLength) return offset;
    let size = view.getUint32(offset, false);
    const type = readUint32BE(fb, offset + 4);
    let hdrSize = 8;
    if (size === 1 && offset + 16 < buffer.byteLength) {
      size = Number(view.getBigUint64(offset + 8, false));
      hdrSize = 16;
    }
    if (size <= 0) return buffer.byteLength;
    const dataStart = offset + hdrSize;
    const dataEnd = offset + size;

    if (type === 0x6D6F6F76) { // "moov"
      parseAtomsIn(dataStart, dataEnd, depth + 1);
    } else if (type === 0x7472616B) { // "trak"
      parseAtomsIn(dataStart, dataEnd, depth + 1);
    } else if (type === 0x6D646961) { // "mdia"
      parseAtomsIn(dataStart, dataEnd, depth + 1);
    } else if (type === 0x6D696E66) { // "minf"
      parseAtomsIn(dataStart, dataEnd, depth + 1);
    } else if (type === 0x7374626C) { // "stbl"
      parseAtomsIn(dataStart, dataEnd, depth + 1);
    } else if (type === 0x73747364) { // "stsd"
      parseAtomsIn(dataStart + 8, dataEnd, depth + 1); // skip version/flags + entry count
    } else if (type === 0x616C6163) { // "alac" - Apple Lossless
      if (dataEnd - dataStart >= 28) {
        const sampleRate = readUint32LE(view, dataStart + 20);
        const channels = fb[dataStart + 21] ? fb[dataStart + 21] : fb[dataStart + 9];
        const bitDepth = fb[dataStart + 25] || 16;
        alacInfo = { sampleRate, channels: channels || 2, bitDepth: bitDepth || 24 };
      }
    } else if (type === 0x6D703461 || type === 0x61616320 || type === 0x6D703466) { // "mp4a" or "aac " or "mp4f"
      // Audio Sample Entry
      if (dataEnd - dataStart >= 28) {
        const channels = view.getUint16(dataStart + 16, false);
        const sampleRate = view.getUint32(dataStart + 24, false);
        aacChannels = channels;
        aacSampleRate = sampleRate;
      }
      // Check for alac in esds or as an inner atom
      parseAtomsIn(dataStart + 28, dataEnd, depth + 1);
    }

    return dataEnd;
  }

  function parseAtomsIn(start, end, depth) {
    let pos = start;
    while (pos + 8 <= end && pos < buffer.byteLength) {
      pos = parseAtom(pos, depth);
      if (pos <= 0) break;
    }
  }

  parseAtomsIn(0, buffer.byteLength, 0);

  if (alacInfo) {
    return { codec: 'ALAC', container: 'MP4/M4A', isLossless: true, sampleRate: alacInfo.sampleRate, channels: alacInfo.channels, bitDepth: alacInfo.bitDepth };
  }
  if (aacSampleRate) {
    return { codec: 'AAC', container: 'MP4/M4A', isLossless: false, sampleRate: aacSampleRate, channels: aacChannels, bitDepth: null };
  }
  return result;
}

// --- Main format detection ---
function detectFormat(file, buffer) {
  const name = file.name.toLowerCase();
  const ext = name.split('.').pop();

  let info = null;
  const parsers = [parseFlac, parseWav, parseAiff, parseMp3, parseOgg, parseMp4];
  for (const parser of parsers) {
    info = parser(buffer);
    if (info) break;
  }

  if (!info) {
    // Fallback based on extension
    const lossyExts = ['mp3','aac','ogg','opus','m4a','wma'];
    const losslessExts = ['flac','wav','aiff','aif','alac','ape'];
    info = {
      codec: ext.toUpperCase(),
      container: ext.toUpperCase(),
      isLossless: losslessExts.includes(ext)
    };
  }

  return info;
}

// ===================== FFT (Radix-2) =====================
function fftRadix2(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    while (j & bit) { j ^= bit; bit >>= 1; }
    j ^= bit;
    if (i < j) {
      [re[i], re[j]] = [re[j], re[i]];
      [im[i], im[j]] = [im[j], im[i]];
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wRe = Math.cos(ang), wIm = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cRe = 1, cIm = 0;
      for (let j = 0; j < len / 2; j++) {
        const uRe = re[i+j], uIm = im[i+j];
        const vRe = re[i+j+len/2]*cRe - im[i+j+len/2]*cIm;
        const vIm = re[i+j+len/2]*cIm + im[i+j+len/2]*cRe;
        re[i+j] = uRe + vRe;
        im[i+j] = uIm + vIm;
        re[i+j+len/2] = uRe - vRe;
        im[i+j+len/2] = uIm - vIm;
        const nR = cRe*wRe - cIm*wIm;
        cIm = cRe*wIm + cIm*wRe;
        cRe = nR;
      }
    }
  }
}

// ===================== ANALYSIS FUNCTIONS =====================

function computeAverageSpectrum(channelData, sampleRate, fftSize) {
  const totalSamples = channelData.length;
  const binCount = fftSize / 2;
  const hopSize = fftSize / 2;
  const numHops = Math.floor((totalSamples - fftSize) / hopSize);
  const maxHops = 300;
  const hopStep = Math.max(1, Math.floor(numHops / maxHops));

  const re = new Float32Array(fftSize);
  const im = new Float32Array(fftSize);
  const win = new Float32Array(fftSize);
  for (let i = 0; i < fftSize; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / fftSize);

  const avgDB = new Float32Array(binCount).fill(DB_FLOOR);
  const peakDB = new Float32Array(binCount).fill(DB_FLOOR);
  let count = 0;
  let sumLinear = new Float32Array(binCount);

  for (let hop = 0; hop < numHops; hop += hopStep) {
    const start = hop * hopSize;
    if (start + fftSize > totalSamples) break;
    for (let i = 0; i < fftSize; i++) {
      re[i] = channelData[start + i] * win[i];
      im[i] = 0;
    }
    fftRadix2(re, im);
    for (let k = 0; k < binCount; k++) {
      const mag = Math.sqrt(re[k]*re[k] + im[k]*im[k]) / fftSize;
      sumLinear[k] += mag;
      const db = linearTodB(mag);
      if (db > peakDB[k]) peakDB[k] = db;
    }
    count++;
  }
  for (let k = 0; k < binCount; k++) {
    if (count > 0) avgDB[k] = linearTodB(sumLinear[k] / count);
  }

  return { avgDB, peakDB, binCount, nyquist: sampleRate / 2 };
}

function analyzeFrequencyCutoff(avgDB, sampleRate, fftSize) {
  const binCount = avgDB.length;
  const nyquist = sampleRate / 2;
  const binHz = nyquist / binCount;

  // Find approximate peak energy in the mid-band (not DC)
  let peakDB = -Infinity;
  const startBin = Math.max(1, Math.floor(200 / binHz)); // start from 200Hz
  const endBin = Math.floor(binCount * 0.9);
  for (let i = startBin; i < endBin; i++) {
    if (avgDB[i] > peakDB) peakDB = avgDB[i];
  }

  if (!isFinite(peakDB)) {
    return { cutoffFreq: Math.round(nyquist), nyquist: Math.round(nyquist), nyquistRatio: 1, isOversampled: false, suspectedOriginalSR: sampleRate };
  }

  const threshold = peakDB - 45; // 45 dB below mid-band peak

  // Method 1: find highest bin where energy is above threshold (with some tolerance)
  let cutoffBin = 0;
  let belowCount = 0;
  const minBelow = 10;

  for (let i = binCount - 1; i > startBin; i--) {
    if (avgDB[i] < threshold) {
      belowCount++;
      if (belowCount >= minBelow) {
        cutoffBin = i + minBelow;
        break;
      }
    } else {
      belowCount = 0;
    }
  }
  if (cutoffBin === 0) cutoffBin = binCount - 1;

  // Method 2: detect brick-wall (sharp rolloff) - for lossy codecs
  let brickWallBin = binCount - 1;
  for (let i = Math.floor(binCount * 0.15); i < binCount - 3; i++) {
    // Check drop across several bins
    const avgBefore = (avgDB[i] + avgDB[i+1]) / 2;
    const avgAfter = (avgDB[i+2] + avgDB[i+3]) / 2;
    if (avgBefore - avgAfter > 25 && avgBefore > peakDB - 20) {
      brickWallBin = i + 1;
      break;
    }
  }

  // Use the lower (earlier) of the two estimates
  cutoffBin = Math.min(cutoffBin, brickWallBin);

  const cutoffFreq = Math.round(cutoffBin * binHz);
  const nyquistRatio = cutoffFreq / nyquist;

  // Determine oversampling
  const isOversampled = nyquistRatio < 0.72 && sampleRate > 48000;
  let suspectedOriginalSR = sampleRate;
  if (isOversampled) {
    const candidates = [44100, 48000, 22050, 24000, 88200, 96000];
    let bestMatch = sampleRate;
    let bestDiff = Infinity;
    for (const c of candidates) {
      if (c < sampleRate) {
        const diff = Math.abs(cutoffFreq - c / 2);
        if (diff < bestDiff) { bestDiff = diff; bestMatch = c; }
      }
    }
    suspectedOriginalSR = bestMatch;
  }

  return {
    cutoffFreq,
    nyquist: Math.round(nyquist),
    nyquistRatio,
    isOversampled,
    suspectedOriginalSR,
    peakDB
  };
}

function analyzeDynamicRange(channelData, sampleRate) {
  const len = channelData.length;

  // --- Overall peak & RMS ---
  let peak = 0;
  let sumSq = 0;
  for (let i = 0; i < len; i++) {
    const v = channelData[i];
    const abs = v < 0 ? -v : v;
    if (abs > peak) peak = abs;
    sumSq += v * v;
  }
  const rms = Math.sqrt(sumSq / len);
  const peakdB = linearTodB(peak);
  const rmsdB = linearTodB(rms);
  const crestFactordB = peakdB - rmsdB;

  // --- Standard DR (Dynamic Range) per PMF / TT DR spec ---
  // Split into ~2-second blocks; per block compute peak and RMS.
  // DR = (2nd-highest block peak) - (average RMS of the loudest 20% blocks).
  const blockSize = Math.max(1, Math.floor(sampleRate * 2));
  const numBlocks = Math.floor(len / blockSize);
  let drValue = crestFactordB; // fallback to crest factor if too short
  let blockPeaks = [];
  let blockRMS = [];
  if (numBlocks >= 2) {
    for (let b = 0; b < numBlocks; b++) {
      const start = b * blockSize;
      let bp = 0, bSum = 0;
      for (let i = 0; i < blockSize; i++) {
        const v = channelData[start + i];
        const a = v < 0 ? -v : v;
        if (a > bp) bp = a;
        bSum += v * v;
      }
      blockPeaks.push(bp);
      blockRMS.push(Math.sqrt(bSum / blockSize));
    }
    // 2nd-highest block peak (exclude the single loudest block)
    const sortedPeaks = blockPeaks.slice().sort((a, b) => b - a);
    const secondPeak = sortedPeaks[1] || sortedPeaks[0];
    // Average RMS of loudest 20% blocks
    const sortedRMS = blockRMS.slice().sort((a, b) => b - a);
    const top20Count = Math.max(1, Math.floor(sortedRMS.length * 0.2));
    let rmsTopSum = 0;
    for (let i = 0; i < top20Count; i++) rmsTopSum += sortedRMS[i];
    const rmsTop20 = rmsTopSum / top20Count;
    drValue = linearTodB(secondPeak) - linearTodB(rmsTop20);
  }

  // --- Clipping detection ---
  // True digital clipping: consecutive samples at the same near-max value.
  // Threshold 0.9999 (~ -0.00087 dBFS). Require >=3 consecutive samples.
  const CLIP_TH = 0.9999;
  const CLIP_RUN = 3;
  let clipCount = 0;
  let runLen = 0;
  let runValue = 0;
  let inClip = false;
  for (let i = 0; i < len; i++) {
    const v = channelData[i];
    const abs = v < 0 ? -v : v;
    if (abs >= CLIP_TH) {
      if (!inClip) { inClip = true; runLen = 1; runValue = v; }
      else {
        // Same sign as previous (flat-top) counts as sustained clip
        if ((v >= 0 && runValue >= 0) || (v < 0 && runValue < 0)) runLen++;
        else { runValue = v; runLen = 1; }
      }
      if (runLen >= CLIP_RUN) clipCount++;
    } else {
      inClip = false; runLen = 0;
    }
  }
  // Also count exact-full-scale samples (0 dBFS) even if isolated
  let exactFullScale = 0;
  for (let i = 0; i < len; i++) {
    const abs = channelData[i] < 0 ? -channelData[i] : channelData[i];
    if (abs >= 1.0 - 1e-7) exactFullScale++;
  }
  const totalClips = Math.max(clipCount, exactFullScale);
  const clipping = totalClips > 0;

  // --- LUFS (simplified, no K-weighting — labeled as approximate) ---
  // True LUFS requires K-weighting + gated blocks. This is a rough estimate.
  const lufs = -0.691 + 10 * Math.log10(Math.max(1e-12, sumSq / len));

  return {
    peak: peakdB,
    rms: rmsdB,
    crestFactor: crestFactordB,
    dynamicRange: drValue,
    clipping,
    clipSamples: totalClips,
    clipRatio: totalClips / len,
    lufs,
    lufsApproximate: true
  };
}

function analyzeStereoCorrelation(left, right) {
  const len = Math.min(left.length, right.length);
  let sumLL = 0, sumRR = 0, sumLR = 0;
  // Sample every 4th sample for performance on long files
  const step = Math.max(1, Math.floor(len / 1000000));
  let count = 0;
  for (let i = 0; i < len; i += step) {
    sumLL += left[i]*left[i];
    sumRR += right[i]*right[i];
    sumLR += left[i]*right[i];
    count++;
  }
  const correlation = sumLR / Math.max(1e-10, Math.sqrt(sumLL * sumRR));

  // Block-wise coherence
  const blockSize = 4096;
  const numBlocks = Math.floor(len / blockSize);
  const maxBlocks = 200;
  const blockStep = Math.max(1, Math.floor(numBlocks / maxBlocks));
  const coherenceValues = [];
  for (let b = 0; b < numBlocks; b += blockStep) {
    let ll = 0, rr = 0, lr = 0;
    const start = b * blockSize;
    for (let i = 0; i < blockSize; i += 2) {
      const idx = start + i;
      if (idx >= len) break;
      ll += left[idx]*left[idx];
      rr += right[idx]*right[idx];
      lr += left[idx]*right[idx];
    }
    coherenceValues.push(lr / Math.max(1e-10, Math.sqrt(ll*rr)));
  }
  const avgCoherence = coherenceValues.length > 0
    ? coherenceValues.reduce((a,b) => a + b, 0) / coherenceValues.length
    : correlation;

  // Mid/Side energy ratio (stereo width)
  let midE = 0, sideE = 0;
  for (let i = 0; i < len; i += step * 2) {
    const m = (left[i]+right[i])/2, s = (left[i]-right[i])/2;
    midE += m*m; sideE += s*s;
  }
  const stereoWidth = Math.min(sideE / Math.max(1e-10, midE), 2);

  return {
    correlation,
    avgCoherence,
    stereoWidth,
    isMono: Math.abs(correlation) > 0.995,
    isPhaseInverted: correlation < -0.8
  };
}

function classifyQuality(formatInfo, cutoffInfo, dynamicRange) {
  const { codec, isLossless, sampleRate, bitDepth, bitrate } = formatInfo;
  const ratings = [];

  // 1. Compression type
  if (isLossless) {
    if (sampleRate >= 96000 && bitDepth >= 24) {
      ratings.push({ name: '压缩类型', level: 'pass', detail: '高解析无损 (Hi-Res Lossless)', desc: `${codec} ${(sampleRate/1000).toFixed(1)}kHz/${bitDepth}bit` });
    } else if (sampleRate >= 44100 && bitDepth >= 16) {
      ratings.push({ name: '压缩类型', level: 'pass', detail: 'CD级无损 (CD-Quality Lossless)', desc: `${codec} ${(sampleRate/1000).toFixed(1)}kHz/${bitDepth}bit` });
    } else {
      ratings.push({ name: '压缩类型', level: 'hint', detail: '无损 (非标准参数)', desc: `${codec} ${(sampleRate/1000).toFixed(1)}kHz/${bitDepth||'?'}bit` });
    }
  } else {
    const br = bitrate || 0;
    if (br >= 320) {
      ratings.push({ name: '压缩类型', level: 'hint', detail: '高品质有损 (High-Quality Lossy)', desc: `${codec} ~${Math.round(br)} kbps` });
    } else if (br >= 160) {
      ratings.push({ name: '压缩类型', level: 'hint', detail: '标准有损 (Standard Lossy)', desc: `${codec} ~${Math.round(br)} kbps` });
    } else if (br >= 64) {
      ratings.push({ name: '压缩类型', level: 'warn', detail: '低码率有损 (Low Bitrate)', desc: `${codec} ~${Math.round(br)} kbps` });
    } else if (br > 0) {
      ratings.push({ name: '压缩类型', level: 'fail', detail: '语音级有损 (Voice-Grade)', desc: `${codec} ~${Math.round(br)} kbps` });
    } else {
      ratings.push({ name: '压缩类型', level: 'warn', detail: '有损压缩', desc: codec });
    }
  }

  // 2. Sample Rate
  if (sampleRate >= 96000) {
    ratings.push({ name: '采样率', level: 'pass', detail: `${(sampleRate/1000).toFixed(1)} kHz — 高解析度`, desc: '≥96 kHz' });
  } else if (sampleRate >= 44100) {
    ratings.push({ name: '采样率', level: 'pass', detail: `${(sampleRate/1000).toFixed(1)} kHz — CD标准`, desc: '≥44.1 kHz' });
  } else if (sampleRate >= 22050) {
    ratings.push({ name: '采样率', level: 'warn', detail: `${(sampleRate/1000).toFixed(1)} kHz — 低于CD标准`, desc: '<44.1 kHz' });
  } else {
    ratings.push({ name: '采样率', level: 'fail', detail: `${(sampleRate/1000).toFixed(1)} kHz — 很低`, desc: '<22.05 kHz' });
  }

  // 3. Bit Depth (only meaningful for lossless)
  if (isLossless && bitDepth) {
    if (bitDepth >= 24) {
      ratings.push({ name: '位深度', level: 'pass', detail: `${bitDepth} bit — 高解析度`, desc: '≥24 bit' });
    } else if (bitDepth >= 16) {
      ratings.push({ name: '位深度', level: 'pass', detail: `${bitDepth} bit — CD标准`, desc: '≥16 bit' });
    } else {
      ratings.push({ name: '位深度', level: 'fail', detail: `${bitDepth} bit — 低于CD标准`, desc: '<16 bit' });
    }
  } else {
    ratings.push({ name: '位深度', level: 'hint', detail: '不适用 (有损格式)', desc: 'PCM位深度不适用于有损压缩' });
  }

  // 4. Fake Lossless detection (only for lossless)
  if (isLossless) {
    const cf = cutoffInfo.cutoffFreq;
    const expectedMin = sampleRate >= 44100 ? 18000 : sampleRate * 0.4;
    if (cf < expectedMin && sampleRate >= 44100) {
      ratings.push({ name: '假无损检测', level: 'warn', detail: `频率截止 ~${cf} Hz，疑似有损转码`, desc: `真无损应延伸至 ~${Math.round(sampleRate/2/1000)} kHz` });
    } else if (cf < sampleRate * 0.45 && sampleRate >= 44100) {
      ratings.push({ name: '假无损检测', level: 'hint', detail: `高频略低 (~${cf} Hz)`, desc: '接近奈奎斯特但未达' });
    } else {
      ratings.push({ name: '假无损检测', level: 'pass', detail: `频率延伸至 ~${cf} Hz`, desc: '未检测到假无损特征' });
    }
  } else {
    ratings.push({ name: '假无损检测', level: 'pass', detail: '文件本身为有损格式', desc: '不适用' });
  }

  // 5. Oversampling / Fake Hi-Res
  if (sampleRate > 48000) {
    if (cutoffInfo.resampledNote) {
      ratings.push({ name: '过采样检测', level: 'hint', detail: `无法可靠检测 (浏览器重采样)`, desc: cutoffInfo.resampledNote });
    } else if (cutoffInfo.isOversampled) {
      ratings.push({ name: '过采样检测', level: 'warn', detail: `疑似过采样! 截止频率 ~${cutoffInfo.cutoffFreq} Hz`, desc: `原始采样率可能为 ${(cutoffInfo.suspectedOriginalSR/1000).toFixed(1)} kHz` });
    } else if (cutoffInfo.nyquistRatio < 0.8) {
      ratings.push({ name: '过采样检测', level: 'hint', detail: `频率截止 ~${cutoffInfo.cutoffFreq} Hz (${(cutoffInfo.nyquistRatio*100).toFixed(0)}% 奈奎斯特)`, desc: '可能由较低采样率升频而来' });
    } else {
      ratings.push({ name: '过采样检测', level: 'pass', detail: `频率延伸至 ~${cutoffInfo.cutoffFreq} Hz`, desc: '高解析度音频真实可信' });
    }
  } else {
    ratings.push({ name: '过采样检测', level: 'pass', detail: '不适用 (≤48 kHz)', desc: '标准采样率范围' });
  }

  // 6. Dynamic Range (DR standard — higher = more dynamic, less compressed)
  const dr = dynamicRange.dynamicRange;
  if (dr >= 14) {
    ratings.push({ name: '动态范围', level: 'pass', detail: `DR ${dr.toFixed(1)} dB — 动态出色`, desc: '动态压缩少' });
  } else if (dr >= 9) {
    ratings.push({ name: '动态范围', level: 'pass', detail: `DR ${dr.toFixed(1)} dB — 良好`, desc: '常规制作' });
  } else if (dr >= 6) {
    ratings.push({ name: '动态范围', level: 'hint', detail: `DR ${dr.toFixed(1)} dB — 中等`, desc: '响度战争风格' });
  } else {
    ratings.push({ name: '动态范围', level: 'warn', detail: `DR ${dr.toFixed(1)} dB — 偏低`, desc: '高度压缩/限幅' });
  }

  // 7. Clipping
  if (dynamicRange.clipping) {
    ratings.push({ name: '削波检测', level: 'warn', detail: `检测到削波`, desc: `${dynamicRange.clipSamples.toLocaleString()} 个样本达到 0 dBFS (${(dynamicRange.clipRatio*100).toFixed(4)}%)` });
  } else {
    ratings.push({ name: '削波检测', level: 'pass', detail: '无削波', desc: '峰值: ' + dynamicRange.peak.toFixed(2) + ' dBFS' });
  }

  // 8. Frequency Extension
  const cf = cutoffInfo.cutoffFreq;
  if (cf >= 20000) {
    ratings.push({ name: '频率延伸', level: 'pass', detail: `~${cf} Hz — 全频段`, desc: '≥20 kHz' });
  } else if (cf >= 16000) {
    ratings.push({ name: '频率延伸', level: 'hint', detail: `~${cf} Hz — 良好`, desc: '高频略有衰减' });
  } else if (cf >= 10000) {
    ratings.push({ name: '频率延伸', level: 'warn', detail: `~${cf} Hz — 高频不足`, desc: '<16 kHz' });
  } else {
    ratings.push({ name: '频率延伸', level: 'fail', detail: `~${cf} Hz — 严重缺失`, desc: '<10 kHz' });
  }

  // Overall score
  const scoreMap = { pass: 0, hint: 1, warn: 2, fail: 3 };
  let totalScore = 0;
  for (const r of ratings) totalScore += scoreMap[r.level];
  const avgScore = totalScore / ratings.length;

  let overallLevel;
  if (avgScore <= 0.3) overallLevel = 'pass';
  else if (avgScore <= 0.8) overallLevel = 'hint';
  else if (avgScore <= 1.5) overallLevel = 'warn';
  else overallLevel = 'fail';

  const overallLabels = {
    pass: '优质音频 (High Quality)',
    hint: '良好音频 (Good Quality)',
    warn: '存在问题 (Issues Detected)',
    fail: '质量不佳 (Poor Quality)'
  };

  return { ratings, overallLevel, overallLabel: overallLabels[overallLevel] };
}

function drawSpectrum(canvas, avgDB, peakDB, sampleRate, cutoffFreq) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.clientWidth * 2;
  const H = canvas.height = 600;
  ctx.clearRect(0, 0, W, H);

  const binCount = avgDB.length;
  const nyquist = sampleRate / 2;
  const minFreq = 20;
  const maxFreq = Math.min(nyquist, sampleRate / 2);
  const minLog = Math.log10(minFreq);
  const maxLog = Math.log10(maxFreq);

  const padL = 60, padR = 20, padT = 30, padB = 40;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const minDB = -96, maxDB = 0;

  function freqToX(f) {
    if (f <= minFreq) return padL;
    if (f >= maxFreq) return padL + plotW;
    return padL + ((Math.log10(f) - minLog) / (maxLog - minLog)) * plotW;
  }
  function dbToY(db) {
    const d = Math.max(minDB, Math.min(maxDB, db));
    return padT + ((maxDB - d) / (maxDB - minDB)) * plotH;
  }

  // Grid - vertical (frequency)
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'center';
  const freqMarks = [20,30,50,100,200,500,1000,2000,5000,10000,20000,30000,40000,50000,60000,80000,100000];
  for (const f of freqMarks) {
    if (f > maxFreq || f < minFreq) continue;
    const x = freqToX(f);
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H-padB); ctx.stroke();
    const label = f >= 1000 ? (f/1000)+'k' : f;
    ctx.fillText(label, x, H-padB+20);
  }

  // Grid - horizontal (dB)
  ctx.textAlign = 'right';
  for (let db = minDB; db <= maxDB; db += 12) {
    const y = dbToY(db);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillText(db+' dB', padL-6, y+5);
  }

  // Peak spectrum (yellow, low opacity)
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(234,179,8,0.35)';
  ctx.lineWidth = 1.5;
  let first = true;
  for (let i = 1; i < binCount; i++) {
    const freq = (i / binCount) * nyquist;
    if (freq < minFreq) continue;
    const x = freqToX(freq), y = dbToY(peakDB[i]);
    if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
  }
  ctx.stroke();

  // Average spectrum gradient line
  ctx.beginPath();
  const grad = ctx.createLinearGradient(0, padT, 0, H-padB);
  grad.addColorStop(0, 'rgba(59,130,246,0.9)');
  grad.addColorStop(0.5, 'rgba(99,102,241,0.7)');
  grad.addColorStop(1, 'rgba(168,85,247,0.5)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2;
  first = true;
  for (let i = 1; i < binCount; i++) {
    const freq = (i / binCount) * nyquist;
    if (freq < minFreq) continue;
    const x = freqToX(freq), y = dbToY(avgDB[i]);
    if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
  }
  ctx.stroke();

  // Fill under average
  ctx.lineTo(freqToX(maxFreq), dbToY(minDB));
  ctx.lineTo(freqToX(minFreq), dbToY(minDB));
  ctx.closePath();
  const fillGrad = ctx.createLinearGradient(0, padT, 0, H-padB);
  fillGrad.addColorStop(0, 'rgba(59,130,246,0.15)');
  fillGrad.addColorStop(1, 'rgba(59,130,246,0.02)');
  ctx.fillStyle = fillGrad;
  ctx.fill();

  // Cutoff line
  if (cutoffFreq > minFreq && cutoffFreq < maxFreq) {
    const cx = freqToX(cutoffFreq);
    ctx.save();
    ctx.strokeStyle = 'rgba(239,68,68,0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, H-padB); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(239,68,68,0.9)';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    const label = cutoffFreq >= 1000 ? (cutoffFreq/1000).toFixed(1)+' kHz' : cutoffFreq+' Hz';
    ctx.fillText('频率截止 ~' + label, cx, padT - 8);
  }

  // Axis label
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('频率 (Hz)', W/2, H-2);
}

function drawSpectrogram(canvas, channelData, sampleRate, duration) {
  const ctx = canvas.getContext('2d');
  const totalSamples = channelData.length;
  const fftSize = 2048;
  const hopSize = 1024;
  const numFrames = Math.floor((totalSamples - fftSize) / hopSize);
  const maxFrames = 1000;
  const frameStep = Math.max(1, Math.floor(numFrames / maxFrames));
  const displayFrames = Math.ceil(numFrames / frameStep);
  const freqBins = fftSize / 2;

  const W = canvas.width = Math.max(displayFrames, 400);
  const H = canvas.height = 256;
  const displayBins = H;

  const window = new Float32Array(fftSize);
  for (let i = 0; i < fftSize; i++) window[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / fftSize);

  const imageData = ctx.createImageData(W, H);
  const pixels = imageData.data;
  const re = new Float32Array(fftSize);
  const im = new Float32Array(fftSize);

  function colormap(val) {
    val = Math.max(0, Math.min(1, val));
    if (val < 0.15) return [0, 0, Math.floor(val/0.15 * 140)];
    if (val < 0.35) { const t=(val-0.15)/0.2; return [0, Math.floor(t*160), 140+Math.floor(t*80)]; }
    if (val < 0.55) { const t=(val-0.35)/0.2; return [Math.floor(t*180), 160+Math.floor(t*95), 220-Math.floor(t*120)]; }
    if (val < 0.75) { const t=(val-0.55)/0.2; return [180+Math.floor(t*75), 255-Math.floor(t*100), 100-Math.floor(t*80)]; }
    { const t=(val-0.75)/0.25; return [255, 155-Math.floor(t*100), 20-Math.floor(t*20)]; }
  }

  for (let frame = 0; frame < displayFrames; frame++) {
    const start = frame * frameStep * hopSize;
    if (start + fftSize > totalSamples) break;
    for (let i = 0; i < fftSize; i++) {
      re[i] = (start + i < totalSamples) ? channelData[start + i] * window[i] : 0;
      im[i] = 0;
    }
    fftRadix2(re, im);

    const binStep = freqBins / displayBins;
    for (let y = 0; y < displayBins; y++) {
      const bin = Math.round(y * binStep);
      const mag = Math.sqrt(re[bin]*re[bin] + im[bin]*im[bin]) / fftSize;
      const db = linearTodB(mag);
      const norm = Math.max(0, (db + 96) / 96);
      const [r, g, b] = colormap(norm);
      const px = frame, py = H - 1 - y;
      const idx4 = (py * W + px) * 4;
      pixels[idx4] = r; pixels[idx4+1] = g; pixels[idx4+2] = b; pixels[idx4+3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);

  // Time axis
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  const maxTimeMarks = 6;
  const stepT = duration / maxTimeMarks;
  for (let t = 0; t <= duration; t += stepT) {
    const x = (t / duration) * W;
    ctx.fillText(formatDuration(t), x, H - 2);
  }

  // Frequency axis (right side)
  ctx.textAlign = 'left';
  const nyquist = sampleRate / 2;
  const freqLabels = [0, 2000, 5000, 10000, 20000];
  for (const f of freqLabels) {
    if (f > nyquist) continue;
    const y = H - (f / nyquist) * H;
    const label = f >= 1000 ? (f/1000)+'k' : f;
    ctx.fillText(label, 4, y + 4);
  }
}

function drawWaveform(canvas, audioBuffer) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.clientWidth * 2;
  const H = canvas.height = 240;
  ctx.clearRect(0, 0, W, H);

  const data = audioBuffer.getChannelData(0);
  const step = Math.max(1, Math.floor(data.length / W));
  const mid = H / 2;

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();

  // Envelope
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(59,130,246,0.8)');
  grad.addColorStop(0.5, 'rgba(99,102,241,0.5)');
  grad.addColorStop(1, 'rgba(59,130,246,0.8)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  for (let x = 0; x < W; x++) {
    let min = 1, max = -1;
    const startIdx = x * step;
    const endIdx = Math.min(startIdx + step, data.length);
    for (let j = startIdx; j < endIdx; j++) {
      if (data[j] < min) min = data[j];
      if (data[j] > max) max = data[j];
    }
    const y1 = mid - max * mid * 0.95;
    const y2 = mid - min * mid * 0.95;
    ctx.moveTo(x, y1);
    ctx.lineTo(x, y2);
  }
  ctx.stroke();
}

function drawStereoCorrelation(canvas, left, right) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.clientWidth * 2;
  const H = canvas.height = 240;
  ctx.clearRect(0, 0, W, H);

  const len = Math.min(left.length, right.length);
  const blockSize = 4096;
  const numBlocks = Math.floor(len / blockSize);
  const step = Math.max(1, Math.floor(numBlocks / W));

  // Background
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fillRect(0, 0, W, H);

  const mid = H / 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  // Center line
  ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();
  // Top/bottom markers
  ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(W, 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, H-20); ctx.lineTo(W, H-20); ctx.stroke();

  ctx.beginPath();
  ctx.strokeStyle = 'rgba(168,85,247,0.7)';
  ctx.lineWidth = 1.5;
  let first = true;
  for (let i = 0; i < W; i++) {
    const start = i * step * blockSize;
    if (start + blockSize >= len) break;
    let ll = 0, rr = 0, lr = 0;
    for (let j = 0; j < blockSize; j += 2) {
      const idx = start + j;
      ll += left[idx]*left[idx];
      rr += right[idx]*right[idx];
      lr += left[idx]*right[idx];
    }
    const corr = lr / Math.max(1e-10, Math.sqrt(ll*rr));
    const y = mid - corr * (mid - 20);
    if (first) { ctx.moveTo(i, y); first = false; } else { ctx.lineTo(i, y); }
  }
  ctx.stroke();

  // Labels
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('+1 完全相关', W - 4, 26);
  ctx.fillText(' 0 无相关', W - 4, mid - 4);
  ctx.fillText('-1 反相', W - 4, H - 24);
}

// ===================== MAIN ANALYSIS =====================

async function decodeAudioNative(buffer, targetSampleRate) {
  // Try OfflineAudioContext with the native sample rate first (to avoid resampling)
  try {
    const offlineCtx = new OfflineAudioContext(1, 1, targetSampleRate);
    const audioBuffer = await offlineCtx.decodeAudioData(buffer.slice(0));
    return audioBuffer;
  } catch(e) {
    // Fallback: regular AudioContext
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await audioCtx.decodeAudioData(buffer.slice(0));
      return audioBuffer;
    } catch(e2) {
      throw new Error('无法解码此音频文件: ' + e2.message);
    }
  }
}

async function analyzeFile(file) {
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  loading.classList.add('show');
  document.getElementById('results').classList.remove('show');

  try {
    loadingText.textContent = '读取文件...';
    const arrayBuffer = await file.arrayBuffer();

    // Detect format and parse native info
    loadingText.textContent = '检测格式...';
    const formatInfo = detectFormat(file, arrayBuffer);

    // Determine target sample rate for decoding
    const nativeSR = formatInfo.sampleRate || 44100;

    // Decode audio at native sample rate to avoid browser resampling
    loadingText.textContent = '解码音频...';
    const audioBuffer = await decodeAudioNative(arrayBuffer.slice(0), nativeSR);

    // Use native format values when available, fallback to decoded values
    const sampleRate = formatInfo.sampleRate || audioBuffer.sampleRate;
    const channels = formatInfo.channels || audioBuffer.numberOfChannels;
    const bitDepth = formatInfo.bitDepth || null;
    const duration = audioBuffer.duration;

    // Calculate bitrate
    const bitrate = file.size * 8 / duration / 1000;
    formatInfo.bitrate = formatInfo.bitrate || bitrate;
    if (!formatInfo.sampleRate) formatInfo.sampleRate = sampleRate;
    if (!formatInfo.channels) formatInfo.channels = channels;
    if (!formatInfo.bitDepth) formatInfo.bitDepth = bitDepth;

    const fftSize = 8192;

    // Spectrum analysis
    loadingText.textContent = '频谱分析中...';
    const leftData = audioBuffer.getChannelData(0);
    const { avgDB, peakDB } = computeAverageSpectrum(leftData, audioBuffer.sampleRate, fftSize);

    // Frequency cutoff (cutoff freq in Hz is absolute, independent of sample rate)
    loadingText.textContent = '频率截止检测...';
    const cutoffInfo = analyzeFrequencyCutoff(avgDB, audioBuffer.sampleRate, fftSize);
    // If browser resampled (native SR != decoded SR), high-freq info above
    // decoded nyquist is lost. Use native SR for nyquist interpretation but
    // note that oversampling detection becomes unreliable.
    const resampled = audioBuffer.sampleRate !== sampleRate;
    if (resampled) {
      cutoffInfo.nyquist = Math.round(sampleRate / 2);
      cutoffInfo.nyquistRatio = cutoffInfo.cutoffFreq / cutoffInfo.nyquist;
      cutoffInfo.isOversampled = false; // can't reliably detect when resampled
      cutoffInfo.resampledNote = `浏览器重采样至 ${audioBuffer.sampleRate} Hz，过采样检测不可靠`;
    }

    // Dynamic range
    loadingText.textContent = '动态范围分析...';
    const rightData = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : leftData;
    const dynamicRange = analyzeDynamicRange(leftData, audioBuffer.sampleRate);

    // Stereo analysis
    loadingText.textContent = '立体声分析...';
    const stereoInfo = audioBuffer.numberOfChannels > 1
      ? analyzeStereoCorrelation(leftData, rightData)
      : { correlation: 1, avgCoherence: 1, stereoWidth: 0, isMono: true, isPhaseInverted: false };

    // Quality classification
    const quality = classifyQuality(formatInfo, cutoffInfo, dynamicRange);

    // Render
    loading.classList.remove('show');
    renderResults(file, formatInfo, audioBuffer, sampleRate, channels, duration, bitDepth, bitrate,
      avgDB, peakDB, cutoffInfo, dynamicRange, stereoInfo, quality, leftData, rightData);

  } catch(e) {
    loading.classList.remove('show');
    alert('分析失败: ' + e.message);
    console.error(e);
  }
}

function renderResults(file, formatInfo, audioBuffer, sampleRate, channels, duration, bitDepth, bitrate,
    avgDB, peakDB, cutoffInfo, dynamicRange, stereoInfo, quality, leftData, rightData) {
  const results = document.getElementById('results');
  results.classList.add('show');

  // Basic info
  const infoGrid = document.getElementById('infoGrid');
  const compType = formatInfo.isLossless ? '无损' : '有损';
  const compColor = formatInfo.isLossless ? 'var(--green)' : 'var(--orange)';
  const bdDisplay = bitDepth ? bitDepth + ' bit' : '— (有损格式)';
  infoGrid.innerHTML = `
    <div class="info-item"><div class="label">文件名</div><div class="value" style="font-size:.85rem">${escapeHtml(file.name)}</div></div>
    <div class="info-item"><div class="label">文件大小</div><div class="value">${formatSize(file.size)}</div></div>
    <div class="info-item"><div class="label">时长</div><div class="value">${formatDuration(duration)}</div></div>
    <div class="info-item"><div class="label">编解码器</div><div class="value">${formatInfo.codec}</div></div>
    <div class="info-item"><div class="label">容器格式</div><div class="value">${formatInfo.container}</div></div>
    <div class="info-item"><div class="label">压缩类型</div><div class="value" style="color:${compColor}">${compType}</div></div>
    <div class="info-item"><div class="label">采样率</div><div class="value" style="color:var(--green)">${(sampleRate/1000).toFixed(1)} kHz</div></div>
    <div class="info-item"><div class="label">位深度</div><div class="value" style="color:var(--green)">${bdDisplay}</div></div>
    <div class="info-item"><div class="label">声道</div><div class="value">${channels === 1 ? '单声道' : channels === 2 ? '立体声' : channels + ' 声道'}</div></div>
    <div class="info-item"><div class="label">平均码率</div><div class="value">${bitrate.toFixed(0)} kbps</div></div>
    <div class="info-item"><div class="label">总采样数</div><div class="value">${Math.round(duration * sampleRate).toLocaleString()}</div></div>
  `;

  // Spectrum info
  const spectrumInfo = document.getElementById('spectrumInfo');
  const nyqLabel = (cutoffInfo.nyquist/1000).toFixed(1) + ' kHz';
  const cutoffLabel = (cutoffInfo.cutoffFreq/1000).toFixed(1) + ' kHz';
  const oversampledText = cutoffInfo.resampledNote
    ? `<span style="color:var(--text2);font-size:.75rem">${cutoffInfo.resampledNote}</span>`
    : (cutoffInfo.isOversampled ? '⚠ 疑似过采样' : '✓ 未检测到');
  const oversampledColor = cutoffInfo.resampledNote ? 'var(--text2)' : (cutoffInfo.isOversampled ? 'var(--orange)' : 'var(--green)');
  spectrumInfo.innerHTML = `
    <div class="info-item"><div class="label">奈奎斯特频率</div><div class="value">${nyqLabel}</div></div>
    <div class="info-item"><div class="label">频率截止点</div><div class="value">${cutoffLabel}</div></div>
    <div class="info-item"><div class="label">奈奎斯特利用率</div><div class="value">${(cutoffInfo.nyquistRatio*100).toFixed(1)}%</div></div>
    <div class="info-item"><div class="label">过采样检测</div><div class="value" style="color:${oversampledColor}">${oversampledText}</div></div>
  `;

  // Loudness info
  const loudnessInfo = document.getElementById('loudnessInfo');
  const clipText = dynamicRange.clipping
    ? `检测到削波 (${dynamicRange.clipSamples.toLocaleString()} 个样本)`
    : '无削波';
  loudnessInfo.innerHTML = `
    <div class="info-item"><div class="label">峰值电平 (Sample Peak)</div><div class="value">${dynamicRange.peak.toFixed(2)} dBFS <span class="clipping-indicator ${dynamicRange.clipping?'clip':'ok'}" title="${dynamicRange.clipping?'检测到削波':'无削波'}"></span></div></div>
    <div class="info-item"><div class="label">RMS 电平</div><div class="value">${dynamicRange.rms.toFixed(2)} dBFS</div></div>
    <div class="info-item"><div class="label">Crest Factor</div><div class="value">${dynamicRange.crestFactor.toFixed(2)} dB</div></div>
    <div class="info-item"><div class="label">动态范围 (DR)</div><div class="value">${dynamicRange.dynamicRange.toFixed(1)} dB</div></div>
    <div class="info-item"><div class="label">综合响度</div><div class="value">${dynamicRange.lufs.toFixed(1)} LUFS <span style="font-size:.7rem;color:var(--text2)">(近似)</span></div></div>
    <div class="info-item"><div class="label">削波检测</div><div class="value" style="color:${dynamicRange.clipping?'var(--red)':'var(--green)'}">${clipText}</div></div>
  `;

  // Stereo info
  const stereoInfoEl = document.getElementById('stereoInfo');
  const corrColor = stereoInfo.correlation > 0.6 ? 'var(--green)' : stereoInfo.correlation > 0.2 ? 'var(--yellow)' : stereoInfo.correlation > 0 ? 'var(--orange)' : 'var(--red)';
  let statusLabel = '正常立体声';
  let statusColor = 'var(--green)';
  if (stereoInfo.isMono) { statusLabel = '单声道内容'; statusColor = 'var(--yellow)'; }
  else if (stereoInfo.isPhaseInverted) { statusLabel = '反相!'; statusColor = 'var(--red)'; }
  stereoInfoEl.innerHTML = `
    <div class="info-item"><div class="label">立体声相关性</div><div class="value" style="color:${corrColor}">${stereoInfo.correlation.toFixed(3)}</div></div>
    <div class="info-item"><div class="label">相位相干性</div><div class="value">${stereoInfo.avgCoherence.toFixed(3)}</div></div>
    <div class="info-item"><div class="label">立体声宽度</div><div class="value">${stereoInfo.stereoWidth.toFixed(3)}</div></div>
    <div class="info-item"><div class="label">状态</div><div class="value" style="color:${statusColor}">${statusLabel}</div></div>
  `;

  // Quality ratings
  const overall = document.getElementById('qualityOverall');
  overall.className = 'quality-overall ' + quality.overallLevel;
  const labels = { pass: '✓ 优质', hint: '⚡ 良好', warn: '⚠ 存在问题', fail: '✗ 质量不佳' };
  overall.innerHTML = `<span class="quality-badge ${quality.overallLevel}">${labels[quality.overallLevel]}</span> ${quality.overallLabel}`;

  const ratingList = document.getElementById('ratingList');
  ratingList.innerHTML = quality.ratings.map(r => `
    <div class="rating-row">
      <span class="quality-badge ${r.level}">${levelText(r.level)}</span>
      <span class="name">${r.name}</span>
      <span class="detail">${r.detail}${r.desc ? ' — ' + r.desc : ''}</span>
    </div>
  `).join('');

  // Draw visualizations (spectrum freq axis uses decoded sample rate since
  // the FFT was computed on decoded data; cutoff freq is absolute in Hz)
  requestAnimationFrame(() => {
    drawSpectrum(document.getElementById('spectrumCanvas'), avgDB, peakDB, audioBuffer.sampleRate, cutoffInfo.cutoffFreq);
    drawSpectrogram(document.getElementById('spectrogramCanvas'), leftData, audioBuffer.sampleRate, duration);
    drawWaveform(document.getElementById('waveformCanvas'), audioBuffer);
    if (audioBuffer.numberOfChannels > 1) {
      drawStereoCorrelation(document.getElementById('stereoCanvas'), leftData, rightData);
    } else {
      const sc = document.getElementById('stereoCanvas');
      const ctx = sc.getContext('2d');
      const W = sc.width = sc.clientWidth * 2;
      const H = sc.height = 240;
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('单声道音频 — 无法进行立体声分析', W/2, H/2 + 8);
    }
  });
}

function levelText(l) { return { pass:'PASS', hint:'HINT', warn:'WARN', fail:'FAIL' }[l]; }
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===================== EVENT HANDLERS =====================
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) analyzeFile(f);
});
fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) analyzeFile(f);
});
</script>
